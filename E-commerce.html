<h1>Nykaa E-Commerce Performance Analysis</h1>

<h2>Business Problem</h2>
<p>
Nykaa needed visibility into product performance, discount effectiveness, and customer purchasing behavior to optimize revenue and profitability.
</p>

<h2>Data Overview</h2>
<ul>
<li>Sales transactions</li>
<li>Product categories</li>
<li>Discount rates</li>
<li>Customer behavior</li>
</ul>

<h2>Analysis Approach</h2>
<ul>
<li>Data cleaning and transformation</li>
<li>KPI development (Revenue, Profit, AOV)</li>
<li>Category performance analysis</li>
<li>Discount impact evaluation</li>
</ul>

<h2>Key Insights</h2>
<ul>
<li>High discounts did not always lead to higher profit</li>
<li>Few categories contributed majority of revenue</li>
<li>Some products consistently underperformed despite high sales volume</li>
</ul>

<h2>Recommendations</h2>
<ul>
<li>Optimize discount strategy by category</li>
<li>Focus marketing on high-margin products</li>
<li>Re-evaluate underperforming SKUs</li>
</ul>
